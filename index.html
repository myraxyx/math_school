<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Academy: Math Mysteries</title>
    <style>
        :root {
            --primary-dark: #1a1a2e;
            --secondary-dark: #0f3460;
            --tertiary-dark: #16213e;
            --accent-green: #00b894;
            --accent-teal: #00cec9;
            --accent-pink: #fd79a8;
            --accent-red: #ff4757;
            --accent-yellow: #fed330;
            --text-light: #e6e6e6;
            --text-muted: #a0a0a0;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            background-color: var(--primary-dark);
            color: var(--text-light);
            font-family: 'Courier New', monospace;
            line-height: 1.6;
            padding: 10px;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Mobile-first responsive layout */
        .game-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        @media (min-width: 768px) {
            .game-container {
                flex-direction: row;
            }
            
            .main-content {
                flex: 2;
            }
            
            .sidebar {
                flex: 1;
                min-width: 300px;
                max-width: 400px;
            }
        }
        
        /* Main Content Area */
        .main-content {
            background-color: var(--secondary-dark);
            border: 3px solid var(--accent-green);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(0, 184, 148, 0.3);
            order: 1;
        }
        
        @media (min-width: 768px) {
            .main-content {
                order: 1;
                min-height: 600px;
            }
        }
        
        /* Sidebar */
        .sidebar {
            background-color: var(--tertiary-dark);
            border: 3px solid var(--accent-pink);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(253, 121, 168, 0.3);
            order: 2;
        }
        
        /* Pixel Art Styling */
        .pixel-art {
            font-family: 'Courier New', monospace;
            white-space: pre;
            line-height: 1;
            color: var(--accent-teal);
            margin: 10px 0;
            font-size: 10px;
            overflow-x: auto;
        }
        
        @media (min-width: 480px) {
            .pixel-art {
                font-size: 12px;
            }
        }
        
        @media (min-width: 768px) {
            .pixel-art {
                font-size: 14px;
            }
        }
        
        .location-art {
            background-color: #000;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            text-align: center;
            overflow-x: auto;
            max-width: 100%;
        }
        
        /* Typography */
        h1 {
            color: var(--accent-teal);
            text-shadow: 0 0 10px rgba(0, 206, 201, 0.5);
            text-align: center;
            margin: 10px 0 20px;
            font-size: 1.8rem;
            line-height: 1.3;
        }
        
        @media (min-width: 480px) {
            h1 {
                font-size: 2.2rem;
            }
        }
        
        @media (min-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
        }
        
        h2, h3 {
            color: var(--accent-teal);
            margin: 15px 0 10px;
            font-size: 1.2rem;
        }
        
        @media (min-width: 480px) {
            h2, h3 {
                font-size: 1.4rem;
            }
        }
        
        /* Character and Item Colors */
        .character {
            color: var(--accent-yellow);
            font-weight: bold;
        }
        
        .npc {
            color: var(--accent-pink);
        }
        
        .item {
            color: var(--accent-green);
        }
        
        /* Math Problem Area */
        .math-problem {
            background-color: var(--primary-dark);
            border: 2px dashed var(--accent-red);
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            font-size: 0.95rem;
        }
        
        /* Input Area - Responsive */
        .input-area {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
        
        @media (min-width: 480px) {
            .input-area {
                flex-direction: row;
            }
        }
        
        input {
            flex-grow: 1;
            padding: 12px;
            background-color: var(--tertiary-dark);
            border: 2px solid var(--accent-teal);
            color: white;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            min-width: 0; /* Prevents flexbox overflow */
        }
        
        button {
            padding: 12px 20px;
            background-color: var(--accent-red);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            transition: transform 0.2s, opacity 0.2s;
            font-size: 1rem;
            white-space: nowrap;
            flex-shrink: 0;
        }
        
        button:hover, button:active {
            transform: scale(1.05);
            background-color: #ff3838;
            opacity: 0.9;
        }
        
        /* Stats Grid - Responsive */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .stat-box {
            background-color: var(--primary-dark);
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            border: 1px solid var(--accent-teal);
            font-size: 0.9rem;
        }
        
        .stat-box h3 {
            font-size: 1rem;
            margin: 0 0 5px 0;
        }
        
        /* Inventory - Responsive */
        .inventory {
            margin-top: 15px;
        }
        
        .inventory-items {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        
        .inv-item {
            background-color: var(--primary-dark);
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid var(--accent-green);
            font-size: 0.85rem;
            flex: 1 0 calc(50% - 6px); /* Two items per row on mobile */
        }
        
        @media (min-width: 480px) {
            .inv-item {
                flex: 1 0 calc(33.333% - 6px); /* Three items per row on tablet */
            }
        }
        
        /* Quest Display */
        .quest {
            margin: 10px 0;
            padding: 10px;
            background-color: rgba(0, 184, 148, 0.1);
            border-left: 3px solid var(--accent-green);
            border-radius: 0 5px 5px 0;
            font-size: 0.9rem;
        }
        
        /* Choice Buttons - Responsive Grid */
        .choices {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 8px;
            margin: 15px 0;
            width: 100%;
        }
        
        @media (max-width: 480px) {
            .choices {
                grid-template-columns: 1fr;
            }
        }
        
        .choice-btn {
            display: block;
            width: 100%;
            margin: 0;
            padding: 10px;
            text-align: left;
            background-color: var(--primary-dark);
            border: 1px solid var(--accent-pink);
            color: var(--accent-pink);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
            min-height: 44px; /* Better touch target */
        }
        
        .choice-btn:hover, .choice-btn:active {
            background-color: var(--accent-pink);
            color: var(--primary-dark);
        }
        
        /* Hidden Elements */
        .hidden {
            display: none !important;
        }
        
        /* Messages and Alerts */
        .message {
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            animation: fadeIn 0.5s;
            font-size: 0.95rem;
        }
        
        .success {
            background-color: rgba(0, 184, 148, 0.2);
            border: 1px solid var(--accent-green);
        }
        
        .error {
            background-color: rgba(255, 71, 87, 0.2);
            border: 1px solid var(--accent-red);
        }
        
        /* Achievement Display */
        .achievement {
            background-color: rgba(254, 211, 48, 0.2);
            border: 1px solid var(--accent-yellow);
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-size: 0.9rem;
        }
        
        /* NPCs Nearby */
        #npcs-nearby {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 8px;
            margin-top: 10px;
        }
        
        @media (max-width: 480px) {
            #npcs-nearby {
                grid-template-columns: 1fr;
            }
        }
        
        /* Game Text Area */
        #game-text {
            max-height: 300px;
            overflow-y: auto;
            padding-right: 5px;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }
        
        @media (min-width: 768px) {
            #game-text {
                max-height: 400px;
            }
        }
        
        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--tertiary-dark);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--accent-teal);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-green);
        }
        
        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Control Buttons */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 15px;
        }
        
        .controls button {
            width: 100%;
            padding: 10px;
            font-size: 0.9rem;
        }
        
        /* Mobile-specific adjustments */
        @media (max-width: 767px) {
            .main-content, .sidebar {
                padding: 12px;
            }
            
            h1 {
                font-size: 1.6rem;
                margin: 5px 0 15px;
            }
            
            .location-art {
                padding: 8px;
            }
            
            .pixel-art {
                font-size: 9px;
                line-height: 1.1;
            }
            
            .input-area {
                margin-top: 15px;
            }
            
            input, button {
                padding: 10px;
            }
        }
        
        /* Small mobile devices */
        @media (max-width: 380px) {
            body {
                padding: 5px;
            }
            
            h1 {
                font-size: 1.4rem;
            }
            
            .main-content, .sidebar {
                padding: 10px;
            }
            
            .pixel-art {
                font-size: 8px;
            }
            
            .stat-box {
                padding: 8px 5px;
                font-size: 0.8rem;
            }
            
            .stat-box h3 {
                font-size: 0.9rem;
            }
        }
        
        /* Landscape mode optimizations */
        @media (max-height: 600px) and (orientation: landscape) {
            .game-container {
                flex-direction: row;
            }
            
            .main-content {
                flex: 2;
            }
            
            .sidebar {
                flex: 1;
                min-width: 250px;
            }
            
            #game-text {
                max-height: 250px;
            }
            
            .location-art {
                max-height: 100px;
                overflow-y: auto;
            }
        }
        
        /* Touch device optimizations */
        @media (hover: none) and (pointer: coarse) {
            button, .choice-btn {
                min-height: 48px;
                padding: 14px 10px;
            }
            
            input {
                padding: 14px;
                font-size: 16px; /* Prevents iOS zoom on focus */
            }
        }
        
        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #0a0a1a;
            }
            
            .main-content {
                background-color: #0a1a3d;
            }
            
            .sidebar {
                background-color: #101a3d;
            }
        }
        
        /* Print styles */
        @media print {
            body {
                background: white;
                color: black;
            }
            
            .main-content, .sidebar {
                border: 1px solid #ccc;
                box-shadow: none;
                break-inside: avoid;
            }
            
            button, .input-area, .choices {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="main-content">
            <div id="location-art" class="location-art pixel-art"></div>
            <div id="game-text"></div>
            <div id="choices" class="choices"></div>
            <div id="math-problem" class="math-problem hidden"></div>
            <div id="message" class="message hidden"></div>
            
            <div class="input-area">
                <input type="text" id="player-input" placeholder="Type action or answer..." autocomplete="off">
                <button id="submit-btn" onclick="processInput()">▶️ Submit</button>
            </div>
        </div>
        
        <div class="sidebar">
            <h1>🎮 Pixel Academy 🧮</h1>
            
            <div class="stats">
                <div class="stat-box">
                    <h3>INT</h3>
                    <div id="intelligence">10</div>
                </div>
                <div class="stat-box">
                    <h3>REP</h3>
                    <div id="reputation">5</div>
                </div>
                <div class="stat-box">
                    <h3>COINS</h3>
                    <div id="coins">15</div>
                </div>
            </div>
            
            <h3>📍 <span id="current-location">Classroom 1-A</span></h3>
            <h3>📚 Current Quest:</h3>
            <div id="current-quest" class="quest"></div>
            
            <div class="inventory">
                <h3>🎒 Inventory:</h3>
                <div id="inventory-items" class="inventory-items"></div>
            </div>
            
            <div id="achievements" class="hidden"></div>
            
            <h3>👥 NPCs Nearby:</h3>
            <div id="npcs-nearby"></div>
            
            <div class="controls">
                <button onclick="saveGame()" style="background-color: var(--accent-green);">💾 Save</button>
                <button onclick="loadGame()" style="background-color: var(--accent-teal);">📂 Load</button>
                <button onclick="showHelp()" style="background-color: var(--accent-pink);">❓ Help</button>
            </div>
        </div>
    </div>

    <script>
        // Game State
        const gameState = {
            day: 1,
            time: '8:00 AM',
            location: 'classroom',
            intelligence: 10,
            reputation: 5,
            coins: 15,
            inventory: ['Pencil', 'Notebook'],
            completedQuests: [],
            activeQuest: null,
            npcRelationships: {
                'professor_math': { likes: 0, questsCompleted: 0 },
                'class_president': { likes: 0, questsCompleted: 0 },
                'mysterious_transfer': { likes: 0, questsCompleted: 0 },
                'janitor': { likes: 0, questsCompleted: 0 }
            },
            achievements: []
        };

        // NPC Database
        const npcs = {
            'professor_math': {
                name: 'Professor Mathius',
                description: 'Eccentric math teacher',
                locations: ['classroom', 'teachers_lounge'],
                dialogue: {
                    default: "Ah, {player}! Ready to solve some mathematical mysteries?",
                    quest1: "I need help grading these algebra tests. Can you check if x=5 in equation 3x - 7 = 8?",
                    quest1_complete: "Excellent work! You've earned 5 coins!",
                    likes_math: "I see you enjoy mathematics. Let me teach you something special..."
                }
            },
            'class_president': {
                name: 'Amelia',
                description: 'Perfect student with great grades',
                locations: ['classroom', 'library'],
                dialogue: {
                    default: "Hello! Have you been studying for the upcoming test?",
                    quest1: "I lost my calculator! Can you help me solve 15 × 4 ÷ 2?",
                    quest2: "The student council needs to split 120 candies among 30 students. How many each?"
                }
            },
            'mysterious_transfer': {
                name: 'Kai',
                description: 'New student who sits in the back',
                locations: ['classroom', 'rooftop'],
                dialogue: {
                    default: "...",
                    secret1: "I notice patterns others don't. The number 142857 is special...",
                    puzzle: "What comes next: 1, 1, 2, 3, 5, 8, ?"
                }
            },
            'janitor': {
                name: 'Mr. Clean',
                description: 'Janitor who knows school secrets',
                locations: ['hallway', 'storage_room'],
                dialogue: {
                    default: "This school has secrets in its walls... mathematical secrets.",
                    secret_room: "Find the combination: First prime after 10, square of 3, factorial of 3..."
                }
            }
        };

        // Locations with responsive pixel art
        const locations = {
            'classroom': {
                name: 'Classroom 1-A',
                description: 'Your main classroom. Blackboard filled with equations.',
                pixelArt: {
                    mobile: `
      ▄▄▄▄▄▄
   ▄███████▄
  ██  ▒▒  ██
 ██  ▒▒▒▒ ██
 ██ █████ ██
 ██ 2x+5=15
 ██   x=?  ██
 ██▄▄▄▄▄▄▄▄██
    ▀▀  ▀▀`,
                    desktop: `
      ▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄
   ▄███████████████████▄
  ██   ▒▒▒▒      ▒▒▒▒  ██
 ██    ▒▒▒▒▒▒▒▒▒▒▒▒▒▒   ██
 ██    ██████████████   ██
 ██    2x+5=15  x=?     ██
 ██    ░░░░░░░░░░░░░░   ██
 ██    ░░░░░░░░░░░░░░   ██
 ██▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄██
    ▀▀▀▀        ▀▀▀▀`
                },
                npcs: ['professor_math', 'class_president', 'mysterious_transfer']
            },
            'library': {
                name: 'School Library',
                description: 'Quiet library with math books floating in mid-air.',
                pixelArt: {
                    mobile: `
    ▄▄▄▄▄
  ▄██████▄
 ██📚📚██
 ██ π=3.14 ██
 ██  QUIET  ██
 ██▄▄▄▄▄▄▄▄██
   ▀▀  ▀▀`,
                    desktop: `
      ▄▄▄▄▄▄▄▄▄▄▄▄▄
   ▄████████████████▄
  ██📚📚📚📚📚📚📚📚██
 ██                ██
 ██ π=3.14159...   ██
 ██                ██
 ██    QUIET       ██
 ██    ZONE        ██
 ██▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄██
    ▀▀▀▀    ▀▀▀▀`
                },
                npcs: ['class_president']
            },
            'rooftop': {
                name: 'School Rooftop',
                description: 'Windy rooftop with a view. Numbers carved into railing.',
                pixelArt: {
                    mobile: `
      ▄▄
    ▄███▄
   ██   ██
  ██  ☁  ██
 ██  7²=49█
 ██▄▄▄▄▄▄██`,
                    desktop: `
            ▄▄▄▄
         ▄███████▄
        ██       ██
       ██   ☁     ██
      ██    ▄▄    ██
     ██  7²=49   ██
    ██    ▀▀    ██
   ██           ██
  ██▄▄▄▄▄▄▄▄▄▄▄▄██`
                },
                npcs: ['mysterious_transfer']
            },
            'storage_room': {
                name: 'Storage Room',
                description: 'Dusty room with old math equipment.',
                pixelArt: {
                    mobile: `
    ▄▄▄▄
  ▄█████▄
 ██▒▒▒▒▒██
 ██ CALC ██
 ██ 7 8 9 ██
 ██ 4 5 6 ██
 ██▄▄▄▄▄▄██`,
                    desktop: `
      ▄▄▄▄▄▄▄▄▄
   ▄███████████▄
  ██▒▒▒▒▒▒▒▒▒▒▒██
 ██  CALCULATOR ██
 ██  ∞   ±   %  ██
 ██  7   8   9  ██
 ██  4   5   6  ██
 ██  1   2   3  ██
 ██▄▄▄▄▄▄▄▄▄▄▄▄▄██`
                },
                npcs: ['janitor']
            }
        };

        // Quests
        const quests = {
            'math_test_prep': {
                title: 'Prepare for Math Test',
                description: 'Solve 3 practice problems from Professor Mathius',
                requiredProblems: 3,
                solved: 0,
                reward: { coins: 10, intelligence: 2 },
                type: 'math'
            },
            'find_calculator': {
                title: 'Find Lost Calculator',
                description: 'Help Amelia find her lost calculator',
                reward: { coins: 5, reputation: 1 },
                type: 'exploration'
            },
            'number_pattern': {
                title: 'Decode the Pattern',
                description: 'Figure out Kai\'s mysterious number sequence',
                reward: { intelligence: 5 },
                type: 'puzzle'
            }
        };

        // Current game variables
        let currentMathProblem = null;
        let awaitingMathAnswer = false;

        // Initialize game
        function initGame() {
            gameState.activeQuest = 'math_test_prep';
            updateDisplay();
            showMessage("Welcome to Pixel Academy! Type 'help' for commands or tap choices.", "success");
            generateLocationArt();
            setupEventListeners();
        }

        // Setup event listeners for mobile
        function setupEventListeners() {
            // Enter key for input
            document.getElementById('player-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    processInput();
                }
            });
            
            // Touch device optimizations
            if ('ontouchstart' in window) {
                // Larger tap areas
                document.querySelectorAll('button, .choice-btn').forEach(btn => {
                    btn.style.minHeight = '48px';
                });
                
                // Prevent zoom on input focus
                document.getElementById('player-input').addEventListener('focus', function() {
                    this.style.fontSize = '16px';
                });
                
                document.getElementById('player-input').addEventListener('blur', function() {
                    this.style.fontSize = '';
                });
            }
        }

        // Update all displays
        function updateDisplay() {
            // Update stats
            document.getElementById('intelligence').textContent = gameState.intelligence;
            document.getElementById('reputation').textContent = gameState.reputation;
            document.getElementById('coins').textContent = gameState.coins;
            document.getElementById('current-location').textContent = locations[gameState.location].name;
            
            // Update quest display
            const quest = quests[gameState.activeQuest];
            if (quest) {
                document.getElementById('current-quest').innerHTML = 
                    `<strong>${quest.title}</strong><br>${quest.description}`;
            }
            
            // Update inventory
            updateInventory();
            
            // Update nearby NPCs
            updateNPCs();
        }

        // Generate location pixel art based on screen size
        function generateLocationArt() {
            const location = locations[gameState.location];
            const screenWidth = window.innerWidth;
            const isMobile = screenWidth < 768;
            
            // Use mobile art for small screens, desktop for larger
            const art = isMobile ? location.pixelArt.mobile : location.pixelArt.desktop;
            document.getElementById('location-art').textContent = art;
        }

        // Update inventory display
        function updateInventory() {
            const container = document.getElementById('inventory-items');
            container.innerHTML = '';
            
            // Group similar items for better display
            const itemCounts = {};
            gameState.inventory.forEach(item => {
                itemCounts[item] = (itemCounts[item] || 0) + 1;
            });
            
            Object.entries(itemCounts).forEach(([item, count]) => {
                const div = document.createElement('div');
                div.className = 'inv-item';
                div.textContent = count > 1 ? `${item} (${count})` : item;
                container.appendChild(div);
            });
            
            if (gameState.inventory.length === 0) {
                const div = document.createElement('div');
                div.className = 'inv-item';
                div.textContent = 'Empty';
                div.style.opacity = '0.6';
                container.appendChild(div);
            }
        }

        // Update NPCs display
        function updateNPCs() {
            const container = document.getElementById('npcs-nearby');
            container.innerHTML = '';
            
            locations[gameState.location].npcs.forEach(npcId => {
                const npc = npcs[npcId];
                const div = document.createElement('div');
                div.className = 'quest';
                div.innerHTML = `<span class="npc">${npc.name}</span><br><small>${npc.description}</small>`;
                
                // Add quick talk button for mobile
                if (window.innerWidth < 768) {
                    const talkBtn = document.createElement('button');
                    talkBtn.textContent = 'Talk';
                    talkBtn.style.cssText = 'margin-top:5px;padding:5px;font-size:0.8rem;background:var(--accent-pink);width:100%;';
                    talkBtn.onclick = () => talkToNPC(npcId);
                    div.appendChild(talkBtn);
                }
                
                container.appendChild(div);
            });
            
            if (locations[gameState.location].npcs.length === 0) {
                const div = document.createElement('div');
                div.className = 'quest';
                div.textContent = 'No one is here...';
                container.appendChild(div);
            }
        }

        // Show message
        function showMessage(text, type = 'normal') {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.classList.remove('hidden');
            
            // Auto-hide after delay
            setTimeout(() => {
                messageDiv.classList.add('hidden');
            }, 3000);
            
            // For mobile, scroll to message
            if (window.innerWidth < 768) {
                messageDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        // Generate math problem
        function generateMathProblem(difficulty = 'easy') {
            let problem, answer;
            
            switch(difficulty) {
                case 'easy':
                    const a = Math.floor(Math.random() * 10) + 1;
                    const b = Math.floor(Math.random() * 10) + 1;
                    const op = ['+', '-', '×'][Math.floor(Math.random() * 3)];
                    
                    if (op === '+') {
                        problem = `${a} + ${b}`;
                        answer = a + b;
                    } else if (op === '-') {
                        problem = `${a + b} - ${a}`;
                        answer = b;
                    } else {
                        problem = `${a} × ${b}`;
                        answer = a * b;
                    }
                    break;
                    
                case 'medium':
                    const x = Math.floor(Math.random() * 5) + 1;
                    const c = Math.floor(Math.random() * 10) + 1;
                    const d = Math.floor(Math.random() * 10) + 1;
                    problem = `${x}x + ${c} = ${d + x * c}`;
                    answer = d;
                    break;
                    
                case 'hard':
                    const sequence = [2, 4, 8, 16, 32];
                    problem = "Next number: 2, 4, 8, 16, ?";
                    answer = 32;
                    break;
            }
            
            return { problem, answer };
        }

        // Process player input
        function processInput() {
            const inputField = document.getElementById('player-input');
            const input = inputField.value.toLowerCase().trim();
            inputField.value = '';
            
            if (awaitingMathAnswer) {
                checkMathAnswer(input);
                return;
            }
            
            const choicesDiv = document.getElementById('choices');
            choicesDiv.innerHTML = '';
            
            // Command processing
            if (input === 'help' || input === '?') {
                showHelp();
            } else if (input.startsWith('go ') || input.startsWith('goto ')) {
                const locationName = input.replace('go ', '').replace('goto ', '').replace(' ', '_');
                goToLocation(locationName);
            } else if (input === 'look' || input === 'l') {
                describeLocation();
            } else if (input.startsWith('talk ') || input.startsWith('speak ')) {
                const npcName = input.replace('talk ', '').replace('speak ', '').replace('to ', '').replace(' ', '_');
                talkToNPC(npcName);
            } else if (input === 'study' || input === 's') {
                study();
            } else if (input === 'quest' || input === 'q') {
                showQuestInfo();
            } else if (input.startsWith('solve ')) {
                startMathProblem(input.substring(6));
            } else if (input === 'inventory' || input === 'i') {
                showInventory();
            } else if (input === 'stats') {
                showStats();
            } else if (input) {
                showMessage("Type 'help' for commands or tap choices above", "error");
            }
        }

        // Show help
        function showHelp() {
            const gameText = document.getElementById('game-text');
            gameText.innerHTML = `
                <h3>📖 Available Commands:</h3>
                <p><strong>Basic Actions:</strong></p>
                <ul>
                    <li><span class="item">look</span> (l) - Examine location</li>
                    <li><span class="item">study</span> (s) - Increase intelligence</li>
                    <li><span class="item">quest</span> (q) - Check current quest</li>
                    <li><span class="item">inventory</span> (i) - Show items</li>
                    <li><span class="item">stats</span> - Show stats</li>
                </ul>
                
                <p><strong>Movement:</strong></p>
                <ul>
                    <li><span class="item">go [location]</span> - Move to location</li>
                    <li>Locations: classroom, library, rooftop, storage_room</li>
                </ul>
                
                <p><strong>Interaction:</strong></p>
                <ul>
                    <li><span class="item">talk [npc]</span> - Talk to NPC</li>
                    <li><span class="item">solve [level]</span> - Solve math (easy/medium/hard)</li>
                </ul>
                
                <p><strong>Or tap the buttons above for quick actions!</strong></p>
            `;
            
            showChoices();
        }

        // Show inventory
        function showInventory() {
            const gameText = document.getElementById('game-text');
            gameText.innerHTML = `
                <h2>🎒 Inventory</h2>
                <p>You are carrying:</p>
                <div class="inventory-items" style="margin:15px 0;">
                    ${gameState.inventory.map(item => 
                        `<div class="inv-item" style="margin:5px;display:inline-block;">${item}</div>`
                    ).join('')}
                    ${gameState.inventory.length === 0 ? '<p>Your inventory is empty.</p>' : ''}
                </div>
                <p>Coins: ${gameState.coins}</p>
            `;
            showChoices();
        }

        // Show stats
        function showStats() {
            const gameText = document.getElementById('game-text');
            gameText.innerHTML = `
                <h2>📊 Character Stats</h2>
                <div class="stats" style="grid-template-columns:1fr;margin:15px 0;">
                    <div class="stat-box">
                        <h3>Intelligence</h3>
                        <div>${gameState.intelligence}</div>
                        <small>Affects math solving ability</small>
                    </div>
                    <div class="stat-box">
                        <h3>Reputation</h3>
                        <div>${gameState.reputation}</div>
                        <small>How others see you</small>
                    </div>
                    <div class="stat-box">
                        <h3>Day ${gameState.day}</h3>
                        <div>${gameState.time}</div>
                        <small>Current time</small>
                    </div>
                </div>
                <p>Completed Quests: ${gameState.completedQuests.length}</p>
            `;
            showChoices();
        }

        // Go to location
        function goToLocation(locationName) {
            if (locations[locationName]) {
                gameState.location = locationName;
                gameState.time = advanceTime();
                updateDisplay();
                generateLocationArt();
                describeLocation();
                showMessage(`You went to ${locations[locationName].name}`, "success");
            } else {
                showMessage("Location not found! Try: classroom, library, rooftop, storage_room", "error");
            }
        }

        // Describe current location
        function describeLocation() {
            const location = locations[gameState.location];
            const gameText = document.getElementById('game-text');
            
            gameText.innerHTML = `
                <h2>📍 ${location.name}</h2>
                <p>${location.description}</p>
                <p><strong>Time:</strong> ${gameState.time}, Day ${gameState.day}</p>
                
                <p><strong>People here:</strong></p>
                <ul>
                    ${location.npcs.map(npcId => 
                        `<li><span class="npc">${npcs[npcId].name}</span> - ${npcs[npcId].description}</li>`
                    ).join('')}
                    ${location.npcs.length === 0 ? '<li>Nobody is here...</li>' : ''}
                </ul>
                
                <p>What would you like to do?</p>
            `;
            
            showChoices();
        }

        // Talk to NPC
        function talkToNPC(npcId) {
            if (!npcs[npcId]) {
                showMessage("NPC not found here!", "error");
                return;
            }
            
            const npc = npcs[npcId];
            const gameText = document.getElementById('game-text');
            
            let dialogue = npc.dialogue.default.replace('{player}', 'Student');
            
            // Check for special dialogue based on quests
            if (gameState.activeQuest === 'math_test_prep' && npcId === 'professor_math') {
                dialogue = npc.dialogue.quest1;
                
                gameText.innerHTML = `
                    <h2>💬 ${npc.name}</h2>
                    <p>"${dialogue}"</p>
                    
                    <div class="math-problem">
                        <h3>Problem:</h3>
                        <p>Is x = 5 the correct solution for 3x - 7 = 8?</p>
                        <p>Type 'yes' or 'no'</p>
                    </div>
                `;
                
                awaitingMathAnswer = true;
                currentMathProblem = { answer: 'yes', type: 'verification' };
                
            } else if (gameState.activeQuest === 'find_calculator' && npcId === 'class_president') {
                dialogue = npc.dialogue.quest1;
                
                gameText.innerHTML = `
                    <h2>💬 ${npc.name}</h2>
                    <p>"${dialogue}"</p>
                    
                    <div class="math-problem">
                        <h3>Solve: 15 × 4 ÷ 2</h3>
                        <p>Enter your answer:</p>
                    </div>
                `;
                
                awaitingMathAnswer = true;
                currentMathProblem = { answer: '30', type: 'calculation' };
                
            } else {
                gameText.innerHTML = `
                    <h2>💬 ${npc.name}</h2>
                    <p>"${dialogue}"</p>
                    
                    ${npcId === 'mysterious_transfer' ? 
                        `<p>He seems to want to show you something... Maybe try asking about "patterns"</p>` : ''}
                `;
            }
            
            showChoices(npcId);
        }

        // Study action
        function study() {
            gameState.intelligence += 1;
            gameState.time = advanceTime();
            
            const gameText = document.getElementById('game-text');
            gameText.innerHTML = `
                <h2>📚 Studying</h2>
                <p>You spend time studying math problems.</p>
                <p class="success">+1 Intelligence!</p>
                <p>Time passes: ${gameState.time}</p>
            `;
            
            updateDisplay();
            showChoices();
        }

        // Start math problem
        function startMathProblem(difficulty) {
            if (!['easy', 'medium', 'hard'].includes(difficulty)) {
                showMessage("Use: solve easy, solve medium, or solve hard", "error");
                return;
            }
            
            const problem = generateMathProblem(difficulty);
            currentMathProblem = problem;
            awaitingMathAnswer = true;
            
            const gameText = document.getElementById('game-text');
            gameText.innerHTML = `
                <h2>🧮 Math Challenge (${difficulty})</h2>
                <div class="math-problem">
                    <h3>Problem:</h3>
                    <p>${problem.problem}</p>
                    <p>Enter your answer below:</p>
                </div>
            `;
        }

        // Check math answer
        function checkMathAnswer(playerAnswer) {
            const gameText = document.getElementById('game-text');
            
            if (parseInt(playerAnswer) === currentMathProblem.answer || 
                playerAnswer === currentMathProblem.answer.toString()) {
                
                gameState.coins += 5;
                gameState.intelligence += 2;
                
                gameText.innerHTML = `
                    <h2>✅ Correct!</h2>
                    <p>Your answer ${playerAnswer} is correct!</p>
                    <p class="success">+5 Coins, +2 Intelligence!</p>
                    <p>The solution was: ${currentMathProblem.answer}</p>
                `;
                
                // Check if quest progress
                if (gameState.activeQuest === 'math_test_prep') {
                    quests.math_test_prep.solved += 1;
                    
                    if (quests.math_test_prep.solved >= quests.math_test_prep.requiredProblems) {
                        completeQuest('math_test_prep');
                    }
                }
                
            } else {
                gameText.innerHTML = `
                    <h2>❌ Incorrect</h2>
                    <p>Your answer ${playerAnswer} is wrong.</p>
                    <p class="error">Try again!</p>
                    <p>The correct answer was: ${currentMathProblem.answer}</p>
                `;
            }
            
            awaitingMathAnswer = false;
            currentMathProblem = null;
            updateDisplay();
            showChoices();
        }

        // Show choices based on context
        function showChoices(context = null) {
            const choicesDiv = document.getElementById('choices');
            choicesDiv.innerHTML = '';
            
            const choices = [];
            
            // Always available choices
            choices.push(
                { text: '🔍 Look around', action: 'describeLocation()' },
                { text: '📚 Study math', action: 'study()' },
                { text: '📋 Check quest', action: 'showQuestInfo()' },
                { text: '🎒 Inventory', action: 'showInventory()' },
                { text: '📊 Stats', action: 'showStats()' }
            );
            
            // Movement choices
            Object.keys(locations).forEach(loc => {
                if (loc !== gameState.location) {
                    choices.push({
                        text: `🚶 Go to ${locations[loc].name}`,
                        action: `goToLocation('${loc}')`
                    });
                }
            });
            
            // Context-specific choices
            if (context === 'professor_math') {
                choices.unshift(
                    { text: '🧮 Ask for math problem', action: 'startMathProblem(\'medium\')' }
                );
            } else if (context === 'class_president') {
                choices.unshift(
                    { text: '🔢 Help with calculation', action: 'startMathProblem(\'easy\')' }
                );
            }
            
            // Add location-specific NPCs
            locations[gameState.location].npcs.forEach(npcId => {
                choices.push({
                    text: `💬 Talk to ${npcs[npcId].name}`,
                    action: `talkToNPC('${npcId}')`
                });
            });
            
            // Render choices
            choices.forEach(choice => {
                const button = document.createElement('button');
                button.className = 'choice-btn';
                button.textContent = choice.text;
                button.onclick = () => {
                    eval(choice.action);
                    // Scroll to top on mobile
                    if (window.innerWidth < 768) {
                        document.getElementById('game-text').scrollTop = 0;
                    }
                };
                choicesDiv.appendChild(button);
            });
        }

        // Show quest info
        function showQuestInfo() {
            const quest = quests[gameState.activeQuest];
            const gameText = document.getElementById('game-text');
            
            let progress = '';
            if (quest.type === 'math') {
                progress = `<p>Problems solved: ${quest.solved}/${quest.requiredProblems}</p>`;
            }
            
            gameText.innerHTML = `
                <h2>📋 Current Quest</h2>
                <div class="quest">
                    <h3>${quest.title}</h3>
                    <p>${quest.description}</p>
                    ${progress}
                    <p><strong>Reward:</strong> 
                    ${quest.reward.coins ? '💰 ' + quest.reward.coins + ' coins' : ''} 
                    ${quest.reward.intelligence ? '🧠 +' + quest.reward.intelligence + ' INT' : ''}
                    ${quest.reward.reputation ? '⭐ +' + quest.reward.reputation + ' REP' : ''}</p>
                </div>
            `;
            
            showChoices();
        }

        // Complete quest
        function completeQuest(questId) {
            const quest = quests[questId];
            
            if (quest.reward.coins) gameState.coins += quest.reward.coins;
            if (quest.reward.intelligence) gameState.intelligence += quest.reward.intelligence;
            if (quest.reward.reputation) gameState.reputation += quest.reward.reputation;
            
            gameState.completedQuests.push(questId);
            
            // Get new quest
            const availableQuests = Object.keys(quests).filter(q => 
                !gameState.completedQuests.includes(q) && q !== questId
            );
            
            if (availableQuests.length > 0) {
                gameState.activeQuest = availableQuests[0];
            }
            
            const gameText = document.getElementById('game-text');
            gameText.innerHTML = `
                <h2>🎉 Quest Complete!</h2>
                <div class="achievement">
                    <h3>${quest.title} - COMPLETED!</h3>
                    <p>
                        ${quest.reward.coins ? '💰 +' + quest.reward.coins + ' coins<br>' : ''}
                        ${quest.reward.intelligence ? '🧠 +' + quest.reward.intelligence + ' INT<br>' : ''}
                        ${quest.reward.reputation ? '⭐ +' + quest.reward.reputation + ' REP' : ''}
                    </p>
                </div>
                <p>New quest: ${quests[gameState.activeQuest].title}</p>
            `;
            
            updateDisplay();
            showChoices();
        }

        // Advance time
        function advanceTime() {
            const times = ['8:00 AM', '10:00 AM', '12:00 PM', '2:00 PM', '4:00 PM', '6:00 PM'];
            const currentIndex = times.indexOf(gameState.time);
            
            if (currentIndex < times.length - 1) {
                return times[currentIndex + 1];
            } else {
                gameState.day += 1;
                return times[0];
            }
        }

        // Save game
        function saveGame() {
            try {
                localStorage.setItem('pixelAcademySave', JSON.stringify(gameState));
                showMessage('Game saved successfully!', 'success');
            } catch (e) {
                showMessage('Failed to save game. Storage might be full.', 'error');
            }
        }

        // Load game
        function loadGame() {
            try {
                const saved = localStorage.getItem('pixelAcademySave');
                if (saved) {
                    const loadedState = JSON.parse(saved);
                    Object.assign(gameState, loadedState);
                    updateDisplay();
                    describeLocation();
                    generateLocationArt();
                    showMessage('Game loaded successfully!', 'success');
                } else {
                    showMessage('No saved game found!', 'error');
                }
            } catch (e) {
                showMessage('Failed to load game. Save file might be corrupted.', 'error');
            }
        }

        // Handle window resize
        window.addEventListener('resize', function() {
            generateLocationArt();
        });

        // Initialize on load
        window.onload = initGame;
    </script>
</body>
</html>
