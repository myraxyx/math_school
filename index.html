<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Academy: Math Mysteries</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #e6e6e6;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            line-height: 1.6;
        }
        
        .game-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        
        .main-content {
            background-color: #0f3460;
            border: 3px solid #00b894;
            border-radius: 10px;
            padding: 20px;
            min-height: 500px;
            box-shadow: 0 0 15px rgba(0, 184, 148, 0.3);
        }
        
        .sidebar {
            background-color: #16213e;
            border: 3px solid #fd79a8;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(253, 121, 168, 0.3);
        }
        
        .pixel-art {
            font-family: monospace;
            white-space: pre;
            line-height: 1;
            color: #00cec9;
            margin: 10px 0;
        }
        
        .location-art {
            background-color: #000;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            text-align: center;
        }
        
        .character {
            color: #fed330;
            font-weight: bold;
        }
        
        .npc {
            color: #fd79a8;
        }
        
        .item {
            color: #00b894;
        }
        
        .math-problem {
            background-color: #1a1a2e;
            border: 2px dashed #ff4757;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }
        
        .input-area {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        
        input {
            flex-grow: 1;
            padding: 10px;
            background-color: #16213e;
            border: 2px solid #00cec9;
            color: white;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
        }
        
        button {
            padding: 10px 20px;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: scale(1.05);
            background-color: #ff3838;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .stat-box {
            background-color: #1a1a2e;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            border: 1px solid #00cec9;
        }
        
        .inventory {
            margin-top: 15px;
        }
        
        .inventory-items {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        
        .inv-item {
            background-color: #1a1a2e;
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid #00b894;
        }
        
        .quest {
            margin: 10px 0;
            padding: 10px;
            background-color: rgba(0, 184, 148, 0.1);
            border-left: 3px solid #00b894;
        }
        
        .choice-btn {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 8px;
            text-align: left;
            background-color: #1a1a2e;
            border: 1px solid #fd79a8;
            color: #fd79a8;
        }
        
        .choice-btn:hover {
            background-color: #fd79a8;
            color: #1a1a2e;
        }
        
        .hidden {
            display: none;
        }
        
        .message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            animation: fadeIn 0.5s;
        }
        
        .success {
            background-color: rgba(0, 184, 148, 0.2);
            border: 1px solid #00b894;
        }
        
        .error {
            background-color: rgba(255, 71, 87, 0.2);
            border: 1px solid #ff4757;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .achievement {
            background-color: rgba(254, 211, 48, 0.2);
            border: 1px solid #fed330;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        
        h1, h2, h3 {
            color: #00cec9;
            text-shadow: 0 0 10px rgba(0, 206, 201, 0.5);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
    </style>
</head>
<body>
    <h1>🎮 Pixel Academy: Math Mysteries 🧮</h1>
    
    <div class="game-container">
        <div class="main-content">
            <div id="location-art" class="location-art pixel-art"></div>
            <div id="game-text"></div>
            <div id="choices" class="choices"></div>
            <div id="math-problem" class="math-problem hidden"></div>
            <div id="message" class="message hidden"></div>
            
            <div class="input-area">
                <input type="text" id="player-input" placeholder="Type your action or answer...">
                <button onclick="processInput()">▶️ Submit</button>
            </div>
        </div>
        
        <div class="sidebar">
            <div class="stats">
                <div class="stat-box">
                    <h3>INT</h3>
                    <div id="intelligence">10</div>
                </div>
                <div class="stat-box">
                    <h3>REP</h3>
                    <div id="reputation">5</div>
                </div>
                <div class="stat-box">
                    <h3>COINS</h3>
                    <div id="coins">15</div>
                </div>
            </div>
            
            <h3>📍 Location: <span id="current-location">Classroom 1-A</span></h3>
            <h3>📚 Current Quest:</h3>
            <div id="current-quest" class="quest"></div>
            
            <div class="inventory">
                <h3>🎒 Inventory:</h3>
                <div id="inventory-items" class="inventory-items"></div>
            </div>
            
            <div id="achievements" class="hidden"></div>
            
            <h3>👥 NPCs Nearby:</h3>
            <div id="npcs-nearby"></div>
            
            <div style="margin-top: 20px;">
                <button onclick="saveGame()" style="background-color: #00b894;">💾 Save Game</button>
                <button onclick="loadGame()" style="background-color: #00cec9;">📂 Load Game</button>
                <button onclick="showHelp()" style="background-color: #fd79a8;">❓ Help</button>
            </div>
        </div>
    </div>

    <script>
        // Game State
        const gameState = {
            day: 1,
            time: '8:00 AM',
            location: 'classroom',
            intelligence: 10,
            reputation: 5,
            coins: 15,
            inventory: ['Pencil', 'Notebook'],
            completedQuests: [],
            activeQuest: null,
            npcRelationships: {
                'professor_math': { likes: 0, questsCompleted: 0 },
                'class_president': { likes: 0, questsCompleted: 0 },
                'mysterious_transfer': { likes: 0, questsCompleted: 0 },
                'janitor': { likes: 0, questsCompleted: 0 }
            },
            achievements: []
        };

        // NPC Database
        const npcs = {
            'professor_math': {
                name: 'Professor Mathius',
                description: 'Eccentric math teacher with glasses that magnify his eyes',
                locations: ['classroom', 'teachers_lounge'],
                dialogue: {
                    default: "Ah, {player}! Ready to solve some mathematical mysteries?",
                    quest1: "I need help grading these algebra tests. Can you check if x=5 in equation 3x - 7 = 8?",
                    quest1_complete: "Excellent work! You've earned 5 coins!",
                    likes_math: "I see you enjoy mathematics. Let me teach you something special..."
                }
            },
            'class_president': {
                name: 'Amelia',
                description: 'Perfect student with impeccable grades',
                locations: ['classroom', 'library'],
                dialogue: {
                    default: "Hello! Have you been studying for the upcoming test?",
                    quest1: "I lost my calculator! Can you help me solve 15 × 4 ÷ 2?",
                    quest2: "The student council needs to split 120 candies among 30 students. How many each?"
                }
            },
            'mysterious_transfer': {
                name: 'Kai',
                description: 'New student who always sits in the back',
                locations: ['classroom', 'rooftop'],
                dialogue: {
                    default: "...",
                    secret1: "I notice patterns others don't. The number 142857 is special...",
                    puzzle: "What comes next: 1, 1, 2, 3, 5, 8, ?"
                }
            },
            'janitor': {
                name: 'Mr. Clean',
                description: 'Janitor who knows all the school secrets',
                locations: ['hallway', 'storage_room'],
                dialogue: {
                    default: "This school has secrets in its walls... mathematical secrets.",
                    secret_room: "Find the combination: First prime after 10, square of 3, factorial of 3..."
                }
            }
        };

        // Locations with pixel art
        const locations = {
            'classroom': {
                name: 'Classroom 1-A',
                description: 'Your main classroom. Blackboard filled with equations.',
                pixelArt: `
      ▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄
   ▄███████████████████▄
  ██   ▒▒▒▒      ▒▒▒▒  ██
 ██    ▒▒▒▒▒▒▒▒▒▒▒▒▒▒   ██
 ██    ██████████████   ██
 ██    2x+5=15  x=?     ██
 ██    ░░░░░░░░░░░░░░   ██
 ██    ░░░░░░░░░░░░░░   ██
 ██▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄██
    ▀▀▀▀        ▀▀▀▀`,
                npcs: ['professor_math', 'class_president', 'mysterious_transfer']
            },
            'library': {
                name: 'School Library',
                description: 'Quiet library with math books floating in mid-air.',
                pixelArt: `
      ▄▄▄▄▄▄▄▄▄▄▄▄▄
   ▄████████████████▄
  ██📚📚📚📚📚📚📚📚██
 ██                ██
 ██ π=3.14159...   ██
 ██                ██
 ██    QUIET       ██
 ██    ZONE        ██
 ██▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄██
    ▀▀▀▀    ▀▀▀▀`,
                npcs: ['class_president']
            },
            'rooftop': {
                name: 'School Rooftop',
                description: 'Windy rooftop with a view. Some numbers are carved into the railing.',
                pixelArt: `
            ▄▄▄▄
         ▄███████▄
        ██       ██
       ██   ☁     ██
      ██    ▄▄    ██
     ██  7²=49   ██
    ██    ▀▀    ██
   ██           ██
  ██▄▄▄▄▄▄▄▄▄▄▄▄██`,
                npcs: ['mysterious_transfer']
            },
            'storage_room': {
                name: 'Storage Room',
                description: 'Dusty room filled with old math equipment.',
                pixelArt: `
      ▄▄▄▄▄▄▄▄▄
   ▄███████████▄
  ██▒▒▒▒▒▒▒▒▒▒▒██
 ██  CALCULATOR ██
 ██  ∞   ±   %  ██
 ██  7   8   9  ██
 ██  4   5   6  ██
 ██  1   2   3  ██
 ██▄▄▄▄▄▄▄▄▄▄▄▄▄██`,
                npcs: ['janitor']
            }
        };

        // Quests
        const quests = {
            'math_test_prep': {
                title: 'Prepare for Math Test',
                description: 'Solve 3 practice problems from Professor Mathius',
                requiredProblems: 3,
                solved: 0,
                reward: { coins: 10, intelligence: 2 },
                type: 'math'
            },
            'find_calculator': {
                title: 'Find Lost Calculator',
                description: 'Help Amelia find her lost calculator',
                reward: { coins: 5, reputation: 1 },
                type: 'exploration'
            },
            'number_pattern': {
                title: 'Decode the Pattern',
                description: 'Figure out Kai\'s mysterious number sequence',
                reward: { intelligence: 5 },
                type: 'puzzle'
            }
        };

        // Current game variables
        let currentMathProblem = null;
        let awaitingMathAnswer = false;

        // Initialize game
        function initGame() {
            gameState.activeQuest = 'math_test_prep';
            updateDisplay();
            showMessage("Welcome to Pixel Academy! Type 'help' for commands or click choices above.", "success");
            generateLocationArt();
        }

        // Update all displays
        function updateDisplay() {
            // Update stats
            document.getElementById('intelligence').textContent = gameState.intelligence;
            document.getElementById('reputation').textContent = gameState.reputation;
            document.getElementById('coins').textContent = gameState.coins;
            document.getElementById('current-location').textContent = locations[gameState.location].name;
            
            // Update quest display
            const quest = quests[gameState.activeQuest];
            if (quest) {
                document.getElementById('current-quest').innerHTML = 
                    `<strong>${quest.title}</strong><br>${quest.description}`;
            }
            
            // Update inventory
            updateInventory();
            
            // Update nearby NPCs
            updateNPCs();
        }

        // Generate location pixel art
        function generateLocationArt() {
            const location = locations[gameState.location];
            document.getElementById('location-art').textContent = location.pixelArt;
        }

        // Update inventory display
        function updateInventory() {
            const container = document.getElementById('inventory-items');
            container.innerHTML = '';
            gameState.inventory.forEach(item => {
                const div = document.createElement('div');
                div.className = 'inv-item';
                div.textContent = item;
                container.appendChild(div);
            });
        }

        // Update NPCs display
        function updateNPCs() {
            const container = document.getElementById('npcs-nearby');
            container.innerHTML = '';
            locations[gameState.location].npcs.forEach(npcId => {
                const npc = npcs[npcId];
                const div = document.createElement('div');
                div.className = 'quest';
                div.innerHTML = `<span class="npc">${npc.name}</span><br><small>${npc.description}</small>`;
                container.appendChild(div);
            });
        }

        // Show message
        function showMessage(text, type = 'normal') {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.classList.remove('hidden');
            
            setTimeout(() => {
                messageDiv.classList.add('hidden');
            }, 3000);
        }

        // Generate math problem
        function generateMathProblem(difficulty = 'easy') {
            let problem, answer;
            
            switch(difficulty) {
                case 'easy':
                    const a = Math.floor(Math.random() * 10) + 1;
                    const b = Math.floor(Math.random() * 10) + 1;
                    const op = ['+', '-', '×'][Math.floor(Math.random() * 3)];
                    
                    if (op === '+') {
                        problem = `${a} + ${b}`;
                        answer = a + b;
                    } else if (op === '-') {
                        problem = `${a + b} - ${a}`;
                        answer = b;
                    } else {
                        problem = `${a} × ${b}`;
                        answer = a * b;
                    }
                    break;
                    
                case 'medium':
                    const x = Math.floor(Math.random() * 5) + 1;
                    const c = Math.floor(Math.random() * 10) + 1;
                    const d = Math.floor(Math.random() * 10) + 1;
                    problem = `${x}x + ${c} = ${d + x * c}`;
                    answer = d;
                    break;
                    
                case 'hard':
                    const sequence = [2, 4, 8, 16, 32];
                    problem = "Next number: 2, 4, 8, 16, ?";
                    answer = 32;
                    break;
            }
            
            return { problem, answer };
        }

        // Process player input
        function processInput() {
            const input = document.getElementById('player-input').value.toLowerCase().trim();
            document.getElementById('player-input').value = '';
            
            if (awaitingMathAnswer) {
                checkMathAnswer(input);
                return;
            }
            
            const choicesDiv = document.getElementById('choices');
            choicesDiv.innerHTML = '';
            
            // Command processing
            if (input === 'help') {
                showHelp();
            } else if (input.startsWith('go to ')) {
                const locationName = input.substring(6).replace(' ', '_');
                goToLocation(locationName);
            } else if (input === 'look') {
                describeLocation();
            } else if (input.startsWith('talk to ')) {
                const npcName = input.substring(8).replace(' ', '_');
                talkToNPC(npcName);
            } else if (input === 'study') {
                study();
            } else if (input === 'check quest') {
                showQuestInfo();
            } else if (input.startsWith('solve ')) {
                startMathProblem(input.substring(6));
            } else {
                showMessage("Type 'help' for list of commands", "error");
            }
        }

        // Show help
        function showHelp() {
            const gameText = document.getElementById('game-text');
            gameText.innerHTML = `
                <h3>📖 Available Commands:</h3>
                <p><strong>Basic Actions:</strong></p>
                <ul>
                    <li><span class="item">look</span> - Examine current location</li>
                    <li><span class="item">study</span> - Study to increase intelligence</li>
                    <li><span class="item">check quest</span> - Check current quest</li>
                </ul>
                
                <p><strong>Movement:</strong></p>
                <ul>
                    <li><span class="item">go to [location]</span> - Move to different location</li>
                    <li>Available: classroom, library, rooftop, storage_room</li>
                </ul>
                
                <p><strong>Interaction:</strong></p>
                <ul>
                    <li><span class="item">talk to [npc]</span> - Talk to nearby NPC</li>
                    <li><span class="item">solve [difficulty]</span> - Solve math problem (easy/medium/hard)</li>
                </ul>
                
                <p><strong>Current NPCs:</strong></p>
                <ul>
                    <li><span class="npc">Professor Mathius</span> - Math teacher</li>
                    <li><span class="npc">Amelia</span> - Class president</li>
                    <li><span class="npc">Kai</span> - Mysterious transfer student</li>
                    <li><span class="npc">Mr. Clean</span> - Janitor</li>
                </ul>
                
                <p>Or click the choice buttons above for quick actions!</p>
            `;
            
            showChoices();
        }

        // Go to location
        function goToLocation(locationName) {
            if (locations[locationName]) {
                gameState.location = locationName;
                gameState.time = advanceTime();
                updateDisplay();
                generateLocationArt();
                describeLocation();
                showMessage(`You went to ${locations[locationName].name}`, "success");
            } else {
                showMessage("Location not found!", "error");
            }
        }

        // Describe current location
        function describeLocation() {
            const location = locations[gameState.location];
            const gameText = document.getElementById('game-text');
            
            gameText.innerHTML = `
                <h2>📍 ${location.name}</h2>
                <p>${location.description}</p>
                <p><strong>Time:</strong> ${gameState.time}, Day ${gameState.day}</p>
                
                <p><strong>You see:</strong></p>
                <ul>
                    ${location.npcs.map(npcId => 
                        `<li><span class="npc">${npcs[npcId].name}</span> - ${npcs[npcId].description}</li>`
                    ).join('')}
                </ul>
                
                <p>What would you like to do?</p>
            `;
            
            showChoices();
        }

        // Talk to NPC
        function talkToNPC(npcId) {
            if (!npcs[npcId]) {
                showMessage("NPC not found here!", "error");
                return;
            }
            
            const npc = npcs[npcId];
            const gameText = document.getElementById('game-text');
            
            let dialogue = npc.dialogue.default.replace('{player}', 'Student');
            
            // Check for special dialogue based on quests
            if (gameState.activeQuest === 'math_test_prep' && npcId === 'professor_math') {
                dialogue = npc.dialogue.quest1;
                
                gameText.innerHTML = `
                    <h2>💬 Talking with ${npc.name}</h2>
                    <p>"${dialogue}"</p>
                    
                    <div class="math-problem">
                        <h3>Problem to solve:</h3>
                        <p>Is x = 5 the correct solution for 3x - 7 = 8?</p>
                        <p>Type 'yes' or 'no'</p>
                    </div>
                `;
                
                awaitingMathAnswer = true;
                currentMathProblem = { answer: 'yes', type: 'verification' };
                
            } else if (gameState.activeQuest === 'find_calculator' && npcId === 'class_president') {
                dialogue = npc.dialogue.quest1;
                
                gameText.innerHTML = `
                    <h2>💬 Talking with ${npc.name}</h2>
                    <p>"${dialogue}"</p>
                    
                    <div class="math-problem">
                        <h3>Solve: 15 × 4 ÷ 2</h3>
                        <p>Enter your answer:</p>
                    </div>
                `;
                
                awaitingMathAnswer = true;
                currentMathProblem = { answer: '30', type: 'calculation' };
                
            } else {
                gameText.innerHTML = `
                    <h2>💬 Talking with ${npc.name}</h2>
                    <p>"${dialogue}"</p>
                    
                    ${npcId === 'mysterious_transfer' ? 
                        `<p>He seems to want to show you something... Maybe try asking about "patterns"</p>` : ''}
                `;
            }
            
            showChoices(npcId);
        }

        // Study action
        function study() {
            gameState.intelligence += 1;
            gameState.time = advanceTime();
            
            const gameText = document.getElementById('game-text');
            gameText.innerHTML = `
                <h2>📚 Studying</h2>
                <p>You spend time studying math problems.</p>
                <p class="success">+1 Intelligence!</p>
                <p>Time passes: ${gameState.time}</p>
            `;
            
            updateDisplay();
            showChoices();
        }

        // Start math problem
        function startMathProblem(difficulty) {
            if (!['easy', 'medium', 'hard'].includes(difficulty)) {
                showMessage("Use: solve easy, solve medium, or solve hard", "error");
                return;
            }
            
            const problem = generateMathProblem(difficulty);
            currentMathProblem = problem;
            awaitingMathAnswer = true;
            
            const gameText = document.getElementById('game-text');
            gameText.innerHTML = `
                <h2>🧮 Math Challenge (${difficulty})</h2>
                <div class="math-problem">
                    <h3>Problem:</h3>
                    <p>${problem.problem}</p>
                    <p>Enter your answer below:</p>
                </div>
            `;
        }

        // Check math answer
        function checkMathAnswer(playerAnswer) {
            const gameText = document.getElementById('game-text');
            
            if (parseInt(playerAnswer) === currentMathProblem.answer || 
                playerAnswer === currentMathProblem.answer) {
                
                gameState.coins += 5;
                gameState.intelligence += 2;
                
                gameText.innerHTML = `
                    <h2>✅ Correct!</h2>
                    <p>Your answer ${playerAnswer} is correct!</p>
                    <p class="success">+5 Coins, +2 Intelligence!</p>
                    <p>The solution was: ${currentMathProblem.answer}</p>
                `;
                
                // Check if quest progress
                if (gameState.activeQuest === 'math_test_prep') {
                    quests.math_test_prep.solved += 1;
                    
                    if (quests.math_test_prep.solved >= quests.math_test_prep.requiredProblems) {
                        completeQuest('math_test_prep');
                    }
                }
                
            } else {
                gameText.innerHTML = `
                    <h2>❌ Incorrect</h2>
                    <p>Your answer ${playerAnswer} is wrong.</p>
                    <p class="error">Try again!</p>
                    <p>The correct answer was: ${currentMathProblem.answer}</p>
                `;
            }
            
            awaitingMathAnswer = false;
            currentMathProblem = null;
            updateDisplay();
            showChoices();
        }

        // Show choices based on context
        function showChoices(context = null) {
            const choicesDiv = document.getElementById('choices');
            choicesDiv.innerHTML = '';
            
            // Always available choices
            const baseChoices = [
                { text: 'Look around', action: 'describeLocation()' },
                { text: 'Study math', action: 'study()' },
                { text: 'Check quest', action: 'showQuestInfo()' },
                { text: 'Go to Library', action: 'goToLocation(\'library\')' },
                { text: 'Go to Rooftop', action: 'goToLocation(\'rooftop\')' }
            ];
            
            // Context-specific choices
            if (context === 'professor_math') {
                baseChoices.unshift(
                    { text: 'Ask for math problem', action: 'startMathProblem(\'medium\')' }
                );
            } else if (context === 'class_president') {
                baseChoices.unshift(
                    { text: 'Help with calculation', action: 'startMathProblem(\'easy\')' }
                );
            }
            
            // Add location-specific NPCs
            locations[gameState.location].npcs.forEach(npcId => {
                baseChoices.push({
                    text: `Talk to ${npcs[npcId].name}`,
                    action: `talkToNPC('${npcId}')`
                });
            });
            
            // Render choices as buttons
            baseChoices.forEach(choice => {
                const button = document.createElement('button');
                button.className = 'choice-btn';
                button.textContent = choice.text;
                button.onclick = () => eval(choice.action);
                choicesDiv.appendChild(button);
            });
        }

        // Show quest info
        function showQuestInfo() {
            const quest = quests[gameState.activeQuest];
            const gameText = document.getElementById('game-text');
            
            gameText.innerHTML = `
                <h2>📋 Current Quest</h2>
                <div class="quest">
                    <h3>${quest.title}</h3>
                    <p>${quest.description}</p>
                    ${quest.type === 'math' ? 
                        `<p>Problems solved: ${quest.solved}/${quest.requiredProblems}</p>` : ''}
                    <p><strong>Reward:</strong> ${quest.reward.coins ? quest.reward.coins + ' coins, ' : ''} 
                    ${quest.reward.intelligence ? quest.reward.intelligence + ' INT' : ''}
                    ${quest.reward.reputation ? quest.reward.reputation + ' REP' : ''}</p>
                </div>
            `;
            
            showChoices();
        }

        // Complete quest
        function completeQuest(questId) {
            const quest = quests[questId];
            
            if (quest.reward.coins) gameState.coins += quest.reward.coins;
            if (quest.reward.intelligence) gameState.intelligence += quest.reward.intelligence;
            if (quest.reward.reputation) gameState.reputation += quest.reward.reputation;
            
            gameState.completedQuests.push(questId);
            
            // Get new quest
            const availableQuests = Object.keys(quests).filter(q => 
                !gameState.completedQuests.includes(q) && q !== questId
            );
            
            if (availableQuests.length > 0) {
                gameState.activeQuest = availableQuests[0];
            }
            
            const gameText = document.getElementById('game-text');
            gameText.innerHTML = `
                <h2>🎉 Quest Complete!</h2>
                <div class="achievement">
                    <h3>${quest.title} - COMPLETED!</h3>
                    <p>${quest.reward.coins ? '+ ' + quest.reward.coins + ' coins<br>' : ''}
                    ${quest.reward.intelligence ? '+ ' + quest.reward.intelligence + ' INT<br>' : ''}
                    ${quest.reward.reputation ? '+ ' + quest.reward.reputation + ' REP' : ''}</p>
                </div>
                <p>New quest assigned: ${quests[gameState.activeQuest].title}</p>
            `;
            
            updateDisplay();
            showChoices();
        }

        // Advance time
        function advanceTime() {
            const times = ['8:00 AM', '10:00 AM', '12:00 PM', '2:00 PM', '4:00 PM', '6:00 PM'];
            const currentIndex = times.indexOf(gameState.time);
            
            if (currentIndex < times.length - 1) {
                return times[currentIndex + 1];
            } else {
                gameState.day += 1;
                return times[0];
            }
        }

        // Save game
        function saveGame() {
            localStorage.setItem('pixelAcademySave', JSON.stringify(gameState));
            showMessage('Game saved successfully!', 'success');
        }

        // Load game
        function loadGame() {
            const saved = localStorage.getItem('pixelAcademySave');
            if (saved) {
                Object.assign(gameState, JSON.parse(saved));
                updateDisplay();
                describeLocation();
                showMessage('Game loaded!', 'success');
            } else {
                showMessage('No saved game found!', 'error');
            }
        }

        // Initialize on load
        window.onload = initGame;

        // Allow Enter key for input
        document.getElementById('player-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                processInput();
            }
        });
    </script>
</body>
</html>
